name: fae-api

services:
  kafka:
    image: apache/kafka:3.8.0@sha256:c89f315cff967322c5d2021434b32271393cb193aa7ec1d43e97341924e57069
    container_name: fae-kafka
    mem_limit: 1g
    cpus: "1.0"
    restart: unless-stopped
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "faceattend-kraft-cluster-id-0001"
    volumes:
      - kafka_data:/var/lib/kraft-combined-logs
    networks:
      - fae-data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  ms-identity:
    build:
      context: .
      dockerfile: 01-ms-identity/Dockerfile
    image: faceattend/ms-identity:${FACEATTEND_IMAGE_TAG:-latest}
    container_name: fae-ms-identity
    mem_limit: 1g
    cpus: "1.0"
    depends_on:
      kafka:
        condition: service_healthy
      ms-notification:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: ${NEON_JDBC_URL:-jdbc:postgresql://postgres:5432/faceattend_db?stringtype=unspecified}
      SPRING_DATASOURCE_USERNAME: identity_app
      SPRING_DATASOURCE_PASSWORD: ${IDENTITY_DB_PASSWORD:?IDENTITY_DB_PASSWORD is required}
      SPRING_DATASOURCE_HIKARI_SCHEMA: identity
      SPRING_DATA_REDIS_HOST: redis
      FACEATTEND_RECOVERY_STORE: redis
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_LIQUIBASE_ENABLED: "false"
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_PROPERTIES_HIBERNATE_HBM2DDL_CREATE_NAMESPACES: "true"
      SPRING_JPA_PROPERTIES_HIBERNATE_GLOBALLY_QUOTED_IDENTIFIERS: "true"
      FACEATTEND_STORAGE_ENDPOINT: http://minio:9000
      FACEATTEND_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      FACEATTEND_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      FACEATTEND_STORAGE_BUCKET: guardian-documents
      FACEATTEND_AUTH_IDENTITY_URL: http://ms-identity:8081
      FACEATTEND_AUTH_AUTHORIZATION_URL: http://ms-authorization:8082
      FACEATTEND_AUTH_ACADEMIC_URL: http://ms-academic:8083
      FACEATTEND_AUTH_SCHEDULING_URL: http://ms-scheduling:8084
      FACEATTEND_SESSION_COOKIE_SECURE: ${FACEATTEND_SESSION_COOKIE_SECURE:-true}
      FACEATTEND_NOTIFICATION_BASE_URL: http://ms-notification:8088
      FACEATTEND_NOTIFICATION_INTERNAL_TOKEN: "${EMAIL_INTERNAL_TOKEN:?EMAIL_INTERNAL_TOKEN is required}"
      FACEATTEND_NOTIFICATION_LOGIN_URL: "${APP_LOGIN_URL:-}"
      FACEATTEND_ONBOARDING_SERVICE_USER_ID: "${ONBOARDING_SERVICE_USER_ID:-}"
      PII_ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY:?PII_ENCRYPTION_KEY is required}
      PII_HASH_KEY: ${PII_HASH_KEY:?PII_HASH_KEY is required}
      FACEATTEND_ONBOARDING_ACADEMIC_URL: http://ms-academic:8083
      FACEATTEND_ONBOARDING_AUTHORIZATION_URL: http://ms-authorization:8082
      SERVER_PORT: 8081
    ports:
      - "${BIND_IP:-127.0.0.1}:8081:8081"
    networks:
      - fae-edge
      - fae-data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep -q '\"status\":\"UP\"' || curl -sf http://localhost:8081/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 60s

  ms-authorization:
    build:
      context: .
      dockerfile: 02-ms-authorization/Dockerfile
    image: faceattend/ms-authorization:${FACEATTEND_IMAGE_TAG:-latest}
    container_name: fae-ms-authorization
    mem_limit: 1g
    cpus: "1.0"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: ${NEON_JDBC_URL:-jdbc:postgresql://postgres:5432/faceattend_db}
      SPRING_DATASOURCE_USERNAME: authorization_app
      SPRING_DATASOURCE_PASSWORD: ${AUTHORIZATION_DB_PASSWORD:?AUTHORIZATION_DB_PASSWORD is required}
      SPRING_DATASOURCE_HIKARI_SCHEMA: authorization
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_LIQUIBASE_ENABLED: "false"
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_PROPERTIES_HIBERNATE_HBM2DDL_CREATE_NAMESPACES: "true"
      SPRING_JPA_PROPERTIES_HIBERNATE_GLOBALLY_QUOTED_IDENTIFIERS: "true"
      FACEATTEND_AUTH_IDENTITY_URL: http://ms-identity:8081
      FACEATTEND_AUTH_AUTHORIZATION_URL: http://ms-authorization:8082
      FACEATTEND_AUTH_ACADEMIC_URL: http://ms-academic:8083
      SERVER_PORT: 8082
    ports:
      - "${BIND_IP:-127.0.0.1}:8082:8082"
    networks:
      - fae-edge
      - fae-data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health | grep -q '\"status\":\"UP\"' || curl -sf http://localhost:8082/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 60s

  ms-scheduling:
    build:
      context: .
      dockerfile: 04-ms-scheduling/Dockerfile
    image: faceattend/ms-scheduling:${FACEATTEND_IMAGE_TAG:-latest}
    container_name: fae-ms-scheduling
    mem_limit: 1g
    cpus: "1.0"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: ${NEON_JDBC_URL:-jdbc:postgresql://postgres:5432/faceattend_db?stringtype=unspecified}
      SPRING_DATASOURCE_USERNAME: scheduling_app
      SPRING_DATASOURCE_PASSWORD: ${SCHEDULING_DB_PASSWORD:?SCHEDULING_DB_PASSWORD is required}
      SPRING_DATASOURCE_HIKARI_SCHEMA: scheduling
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_LIQUIBASE_ENABLED: "false"
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_PROPERTIES_HIBERNATE_HBM2DDL_CREATE_NAMESPACES: "true"
      SPRING_JPA_PROPERTIES_HIBERNATE_GLOBALLY_QUOTED_IDENTIFIERS: "true"
      FACEATTEND_AUTH_IDENTITY_URL: http://ms-identity:8081
      FACEATTEND_AUTH_AUTHORIZATION_URL: http://ms-authorization:8082
      FACEATTEND_AUTH_ACADEMIC_URL: http://ms-academic:8083
      SERVER_PORT: 8084
    ports:
      - "${BIND_IP:-127.0.0.1}:8084:8084"
    networks:
      - fae-edge
      - fae-data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/actuator/health | grep -q '\"status\":\"UP\"' || curl -sf http://localhost:8084/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 60s

  ms-attendance:
    build:
      context: .
      dockerfile: 05-ms-attendance/Dockerfile
    image: faceattend/ms-attendance:${FACEATTEND_IMAGE_TAG:-latest}
    container_name: fae-ms-attendance
    mem_limit: 1g
    cpus: "1.0"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      JAVA_OPTS: "-Xmx768m"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-faceattend_db}?stringtype=unspecified
      SPRING_DATASOURCE_USERNAME: attendance_app
      SPRING_DATASOURCE_PASSWORD: ${ATTENDANCE_DB_PASSWORD:?ATTENDANCE_DB_PASSWORD is required}
      SPRING_DATASOURCE_HIKARI_SCHEMA: attendance
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_LIQUIBASE_ENABLED: "false"
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_PROPERTIES_HIBERNATE_HBM2DDL_CREATE_NAMESPACES: "true"
      SPRING_JPA_PROPERTIES_HIBERNATE_GLOBALLY_QUOTED_IDENTIFIERS: "true"
      FACEATTEND_AUTH_IDENTITY_URL: http://ms-identity:8081
      FACEATTEND_AUTH_AUTHORIZATION_URL: http://ms-authorization:8082
      FACEATTEND_AUTH_ACADEMIC_URL: http://ms-academic:8083
      FACEATTEND_AUTH_SCHEDULING_URL: http://ms-scheduling:8084
      FACEATTEND_AUTH_CONFIGURATION_URL: ${FACEATTEND_AUTH_CONFIGURATION_URL:-http://ms-configuration:8087}
      FACEATTEND_STORAGE_ENDPOINT: http://minio:9000
      FACEATTEND_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      FACEATTEND_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      FACEATTEND_STORAGE_BUCKET: justification-documents
      SERVER_PORT: 8085
    ports:
      - "${BIND_IP:-127.0.0.1}:8085:8085"
    networks:
      - fae-edge
      - fae-data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8085/actuator/health | grep -q '\"status\":\"UP\"' || curl -sf http://localhost:8085/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 60s

  ms-academic:
    build:
      context: .
      dockerfile: 03-ms-academic/Dockerfile
    image: faceattend/ms-academic:${FACEATTEND_IMAGE_TAG:-latest}
    container_name: fae-ms-academic
    mem_limit: 256m
    cpus: "0.5"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://academic_app:${ACADEMIC_DB_PASSWORD:?ACADEMIC_DB_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-faceattend_db}
      PG_SCHEMA: academic
      PORT: 8083
      IDENTITY_URL: http://ms-identity:8081
      AUTHORIZATION_URL: http://ms-authorization:8082
      KAFKA_BROKERS: kafka:29092
      NODE_ENV: production
    ports:
      - "${BIND_IP:-127.0.0.1}:8083:8083"
    networks:
      - fae-edge
      - fae-data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

  ms-configuration:
    build:
      context: .
      dockerfile: 07-ms-configuration/Dockerfile
    image: faceattend/ms-configuration:${FACEATTEND_IMAGE_TAG:-latest}
    container_name: fae-ms-configuration
    mem_limit: 256m
    cpus: "0.5"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://configuration_app:${CONFIGURATION_DB_PASSWORD:?CONFIGURATION_DB_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-faceattend_db}
      PG_SCHEMA: configuration
      PORT: 8087
      IDENTITY_URL: http://ms-identity:8081
      AUTHORIZATION_URL: http://ms-authorization:8082
      ACADEMIC_URL: http://ms-academic:8083
      KAFKA_BROKERS: kafka:29092
      NODE_ENV: production
    ports:
      - "${BIND_IP:-127.0.0.1}:8087:8087"
    networks:
      - fae-edge
      - fae-data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8087/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

  ms-biometric:
    build:
      context: ./06-ms-biometric
      dockerfile: Dockerfile
    image: faceattend/ms-biometric:${FACEATTEND_IMAGE_TAG:-latest}
    container_name: fae-ms-biometric
    mem_limit: 1g
    cpus: "1.0"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      MONGODB_URL: mongodb://${MONGO_USER:?MONGO_USER is required}:${MONGO_PASSWORD:?MONGO_PASSWORD is required}@mongodb:27017/${MONGO_DB:-faceattend_biometric}?authSource=admin
      PORT: 8086
      IDENTITY_URL: http://ms-identity:8081
      AUTHORIZATION_URL: http://ms-authorization:8082
      ACADEMIC_URL: http://ms-academic:8083
      CONFIGURATION_URL: http://ms-configuration:8087
      KAFKA_BROKERS: kafka:29092
      BIOMETRIC_FINGERPRINT_MATCH_THRESHOLD: ${BIOMETRIC_FINGERPRINT_MATCH_THRESHOLD:-8}
      BIOMETRIC_LIVENESS_CHALLENGE_SECRET: ${BIOMETRIC_LIVENESS_CHALLENGE_SECRET:?Set BIOMETRIC_LIVENESS_CHALLENGE_SECRET in .env (>= 32 random chars)}
      BIOMETRIC_ENCRYPTION_KEY: ${BIOMETRIC_ENCRYPTION_KEY:?BIOMETRIC_ENCRYPTION_KEY is required}
      BIOMETRIC_LIVENESS_TTL_SECONDS: ${BIOMETRIC_LIVENESS_TTL_SECONDS:-120}
      BIOMETRIC_RATE_LIMIT_MAX_ATTEMPTS: ${BIOMETRIC_RATE_LIMIT_MAX_ATTEMPTS:-20}
      BIOMETRIC_RATE_LIMIT_WINDOW_SECONDS: ${BIOMETRIC_RATE_LIMIT_WINDOW_SECONDS:-60}
      BIOMETRIC_MAX_IMAGE_BYTES: ${BIOMETRIC_MAX_IMAGE_BYTES:-3145728}
      BIOMETRIC_MAX_IMAGE_PIXELS: ${BIOMETRIC_MAX_IMAGE_PIXELS:-16000000}
      BIOMETRIC_WS_IDLE_TIMEOUT_SECONDS: "${BIOMETRIC_WS_IDLE_TIMEOUT_SECONDS:-60}"
      BIOMETRIC_WS_IDEMPOTENCY_TTL_SECONDS: "${BIOMETRIC_WS_IDEMPOTENCY_TTL_SECONDS:-300}"
      BIOMETRIC_WS_IDEMPOTENCY_MAX_ENTRIES: "${BIOMETRIC_WS_IDEMPOTENCY_MAX_ENTRIES:-2000}"
    ports:
      - "${BIND_IP:-127.0.0.1}:8086:8086"
    networks:
      - fae-edge
      - fae-data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8086/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

  ms-notification:
    build:
      context: .
      dockerfile: 08-ms-notification/Dockerfile
    image: faceattend/ms-notification:${FACEATTEND_IMAGE_TAG:-latest}
    container_name: fae-ms-notification
    mem_limit: 128m
    cpus: "0.5"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://notification_app:${NOTIFICATION_DB_PASSWORD:?NOTIFICATION_DB_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-faceattend_db}?sslmode=disable
      PG_SCHEMA: notification
      PORT: 8088
      IDENTITY_URL: http://ms-identity:8081
      AUTHORIZATION_URL: http://ms-authorization:8082
      ACADEMIC_URL: http://ms-academic:8083
      SCHEDULING_URL: http://ms-scheduling:8084
      ATTENDANCE_URL: http://ms-attendance:8085
      CONFIGURATION_URL: http://ms-configuration:8087
      KAFKA_BROKERS: kafka:29092
      NOTIFICATION_SERVICE_USERNAME: "${NOTIFICATION_SERVICE_USERNAME:-}"
      NOTIFICATION_SERVICE_PASSWORD: "${NOTIFICATION_SERVICE_PASSWORD:-}"
      ATTENDANCE_ALERTS_ENABLED: "${ATTENDANCE_ALERTS_ENABLED:-true}"
      RISK_ALERT_HOUR: "${RISK_ALERT_HOUR:-7}"
      DAILY_SUMMARY_HOUR: "${DAILY_SUMMARY_HOUR:-19}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USERNAME: "${SMTP_USERNAME:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      SMTP_FROM: "${SMTP_FROM:-}"
      SMTP_STARTTLS: "${SMTP_STARTTLS:-true}"
      SMTP_TIMEOUT_SECONDS: "${SMTP_TIMEOUT_SECONDS:-10}"
      EMAIL_INTERNAL_TOKEN: "${EMAIL_INTERNAL_TOKEN:?EMAIL_INTERNAL_TOKEN is required}"
      WEBHOOK_URL: "${WEBHOOK_URL:-}"
      WEBHOOK_SECRET: "${WEBHOOK_SECRET:-}"
      WEBHOOK_TIMEOUT_SECONDS: "${WEBHOOK_TIMEOUT_SECONDS:-5}"
      PUSH_ENABLED: "${PUSH_ENABLED:-true}"
      EXPO_PUSH_ACCESS_TOKEN: "${EXPO_PUSH_ACCESS_TOKEN:-}"
    ports:
      - "${BIND_IP:-127.0.0.1}:8088:8088"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - fae-edge
      - fae-data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8088/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

  ms-quality:
    build:
      context: .
      dockerfile: 09-ms-quality/Dockerfile
    image: faceattend/ms-quality:${FACEATTEND_IMAGE_TAG:-latest}
    container_name: fae-ms-quality
    mem_limit: 256m
    cpus: "0.5"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://quality_app:${QUALITY_DB_PASSWORD:?QUALITY_DB_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-faceattend_db}
      PG_SCHEMA: quality
      PORT: 8089
      IDENTITY_URL: http://ms-identity:8081
      AUTHORIZATION_URL: http://ms-authorization:8082
      KAFKA_BROKERS: kafka:29092
      NODE_ENV: production
    ports:
      - "${BIND_IP:-127.0.0.1}:8089:8089"
    networks:
      - fae-edge
      - fae-data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8089/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

  kong-gateway:
    image: kong:3.6@sha256:a42d2b4503e7b6674ca7914883bdb0d2274b806b0e397a6af28d1dd57aafce4e
    container_name: fae-kong
    mem_limit: 2g
    cpus: "1.0"
    depends_on:
      kafka:
        condition: service_healthy
      ms-identity:
        condition: service_healthy
      ms-authorization:
        condition: service_healthy
      ms-academic:
        condition: service_healthy
      ms-scheduling:
        condition: service_healthy
      ms-attendance:
        condition: service_healthy
      ms-biometric:
        condition: service_healthy
      ms-configuration:
        condition: service_healthy
      ms-notification:
        condition: service_healthy
      ms-quality:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        out=""
        for o in $$(printf '%s' "$${KONG_CORS_ORIGINS:?KONG_CORS_ORIGINS is required}" | tr ',' ' '); do
          printf '%s' "$$o" | grep -Eq '^https?://[A-Za-z0-9.-]+(:[0-9]+)?$$' || { echo "invalid CORS origin: $$o" >&2; exit 1; }
          out="$${out:+$$out, }\"$$o\""
        done
        general="$${KONG_RATE_LIMIT_PER_MINUTE:-3000}"
        printf '%s' "$$general" | grep -Eq '^[1-9][0-9]*$$' || { echo "invalid KONG_RATE_LIMIT_PER_MINUTE: $$general" >&2; exit 1; }
        sed -e "s#\"__CORS_ORIGINS__\"#$$out#g" -e "s#__RATE_LIMIT_GENERAL__#$$general#g" /kong/kong.yml > /tmp/kong.yml
        exec /docker-entrypoint.sh kong docker-start
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /tmp/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 127.0.0.1:8001
      KONG_DNS_ORDER: 'LAST,A,AAAA,CNAME'
      KONG_DNS_VALID_TTL: '5'
      KONG_DNS_STALE_TTL: '0'
      KONG_UNTRUSTED_LUA_SANDBOX_REQUIRES: resty.http
      KONG_NGINX_HTTP_LUA_SHARED_DICT: fae_ws_tickets 1m
      KONG_TRUSTED_IPS: "10.204.10.100,10.204.10.101"
      KONG_REAL_IP_HEADER: X-Forwarded-For
      KONG_REAL_IP_RECURSIVE: "on"
      KONG_CORS_ORIGINS: ${KONG_CORS_ORIGINS:-http://localhost:8090,http://127.0.0.1:8090,http://localhost:8080,http://127.0.0.1:8080,http://localhost:8081,http://localhost:19006}
      KONG_RATE_LIMIT_PER_MINUTE: ${KONG_RATE_LIMIT_PER_MINUTE:-3000}
    ports:
      - "${KONG_PROXY_BIND_IP:-0.0.0.0}:${KONG_PROXY_PORT:-8000}:8000"
    volumes:
      - ./99-api-gateway/kong/kong.yml:/kong/kong.yml:ro
    networks:
      - fae-edge
      - fae-data
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

networks:
  fae-edge:
    external: true
    name: fae-edge
  fae-data:
    external: true
    name: fae-data

volumes:
  kafka_data:
